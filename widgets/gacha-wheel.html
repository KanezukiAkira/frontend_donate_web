<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer">
  <title>Vòng Quay Gacha OBS Overlay</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Orbitron:wght@700;900&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/widgets/gacha-wheel.css">
</head>

<body>
  <!-- OBS Connection Status Pill (Hiển thị 7 giây khi mở widget trên OBS) -->
  <div class="obs-status-pill" id="obsStatusPill">
    <div class="status-dot"></div>
    <span id="obsStatusText">Vòng Quay Gacha OBS • Đã sẵn sàng</span>
  </div>

  <!-- SÂN KHẤU VÒNG QUAY MAY MẮN (HIỂN THỊ GIỮA MÀN HÌNH KHI KÍCH HOẠT) -->
  <div id="gachaWheelContainer" class="gacha-widget-container">
    <div class="gacha-wheel-card">
      <div class="gacha-ambient-glow"></div>

      <!-- Header: Thông tin người donate kích hoạt -->
      <div class="gacha-donor-card">
        <div class="gacha-donor-header">
          <span class="gacha-wheel-badge" id="gachaWheelBadge"><svg class="badge-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="14" height="14" style="vertical-align:middle;margin-right:4px;"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2.5"/><path d="M9.5 3h5M12 3v2"/></svg>VÒNG QUAY TIME</span>
          <span class="gacha-tier-badge" id="gachaTierBadge">GÓI 20.000 ₫</span>
        </div>
        <div class="gacha-donor-body">
          <span class="donor-name" id="gachaDonorName">Khán giả</span>
          <span class="donor-action">vừa kích hoạt</span>
          <span class="donor-amount" id="gachaDonorAmount">20.000 ₫</span>
        </div>
        <div class="gacha-message-wrap" id="gachaMessageWrap" style="display:none;">
          <div class="donor-message" id="gachaDonorMessage">Lời nhắn...</div>
        </div>
      </div>

      <!-- Sân khấu Vòng Quay Canvas -->
      <div class="wheel-stage">
        <!-- Kim chỉ kim loại ở đỉnh 12 giờ -->
        <div class="wheel-pointer" id="wheelPointer">
          <svg viewBox="0 0 32 42" width="36" height="46">
            <defs>
              <linearGradient id="pointerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#ef4444" />
                <stop offset="50%" stop-color="#f87171" />
                <stop offset="100%" stop-color="#b91c1c" />
              </linearGradient>
              <filter id="pointerShadow" x="-20%" y="-20%" width="140%" height="140%">
                <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000" flood-opacity="0.8" />
              </filter>
            </defs>
            <path d="M16 42 L3 8 C3 4, 8 1, 16 1 C24 1, 29 4, 29 8 Z" fill="url(#pointerGrad)" stroke="#ffffff"
              stroke-width="2" filter="url(#pointerShadow)" />
            <circle cx="16" cy="11" r="4" fill="#ffffff" />
          </svg>
        </div>

        <canvas id="wheelCanvas" width="360" height="360"></canvas>

        <div class="wheel-center-cap" id="wheelCenterCap">
          <div class="cap-inner">
            <span class="cap-icon" id="capIcon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="22" height="22"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2.5"/><path d="M9.5 3h5M12 3v2"/></svg></span>
            <span class="cap-label" id="capLabel">TIME</span>
          </div>
        </div>
      </div>

      <!-- Banner công bố kết quả sau khi quay xong -->
      <div class="gacha-result-banner" id="gachaResultBanner">
        <div class="result-main-title" id="gachaResultTitle">+300 GIÂY</div>
        <div class="result-sub-note" id="gachaResultSubtitle">+300 giây vào thời gian Subathon!</div>
      </div>
    </div>
  </div>

  <!-- Particle / Confetti Canvas -->
  <canvas id="fxCanvas" class="fx-canvas"></canvas>

  <script src="https://js.pusher.com/8.2.0/pusher.min.js"></script>
  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/core/storage.js"></script>
  <script src="../assets/js/core/api-client.js"></script>
  <script src="../assets/js/utils/formatters.js"></script>
  <script src="../assets/js/utils/sound.js"></script>
  <script src="../assets/js/services/gacha.service.js"></script>
  <script src="../assets/js/widgets/gacha-wheel.js"></script>
</body>

</html>
